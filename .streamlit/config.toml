[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f7fc"
textColor = "#17243a"
font = "sans serif"

[server]
headless = false
# Avoid Streamlit inspecting torch.classes while discovering watched modules.
# Source changes require a manual app restart with this setting.
fileWatcherType = "none"

